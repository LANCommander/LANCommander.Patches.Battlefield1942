; bf1942patch for Battlefield 1942 1.61 (BF1942.exe). Install: copy dinput8.dll, this file and the bf1942patch
; folder next to BF1942.exe. The log goes to bf1942patch.log next to this file.
; 1 = on, 0 = off. Every option is on by default; set one to 0 to get the original behaviour back.
; Settings.ini in the save folder (see [Saves]; created on the first start) may hold any of these sections and keys
; too; its values win over this file (except for [Saves], which decides where that folder is). The options the
; patch adds to the game's own menus are stored there.

[General]
; 0 = load, but patch nothing
Enabled=1

[Saves]
; profiles (options, controls, server lists), the current profile, campaign progress, the server set-up and the
; screenshots in %USERPROFILE%\Saved Games\DICE\Battlefield 1942 instead of the install folder (for every mod:
; Mods\<mod>\Settings, Mods\<mod>\save). Existing profiles and saves are copied over the first time a mod is used;
; files only the install has (the shipped defaults) are still read from there
Redirect=1
; use this folder instead (environment variables allowed, e.g. %APPDATA%\BF1942); empty = Saved Games
Folder=
; log every file path the patch redirects (1), or every file the game opens (2) (troubleshooting)
LogFiles=0

[Registry]
; the game never reads or writes the registry: the CD keys come from [CDKey] or a cdkey file, everything else the
; game keeps there is answered in memory. The game runs from any folder without an installer
UseFile=1
; log every registry access of the game (troubleshooting)
LogAccess=0

[CDKey]
; the CD keys. Empty = a file named cdkey (or cdkey.txt) in the save folder or next to BF1942.exe: the key on its
; first line, and optional lines XPack1=<key> / XPack2=<key> for the expansions (see bf1942patch\cdkey.example).
; An expansion without a key of its own uses the Battlefield 1942 key
Key=
; The Road to Rome
XPack1=
; Secret Weapons of WWII
XPack2=

[Game]
; the install language the game is told (English, German, French, Spanish, Italian, ...); empty = English
Language=

[Network]
; the server list and server reporting through OpenSpy (GameSpy is gone): every GameSpy host name goes to its
; openspy.net twin, and the master server names (master.gamespy.com, master.bf1942.sk, master.bf1942.org) to
; MasterServer
OpenSpy=1
; the master server; empty = master.openspy.net
MasterServer=

[Display]
; a borderless window that covers the monitor instead of exclusive full screen: the desktop resolution never
; changes (not even when the game restarts itself for every map, see [Restart]) and alt-tab is instant. Pick the
; monitor's own resolution in the video options for a sharp picture; any other is scaled to fit
Borderless=1
; the monitor to use (1, 2, ...; 0 = the main one)
Monitor=0
; wait for the monitor's refresh (no tearing; the desktop compositor usually prevents it already)
VSync=0
; the game sees the monitor's real pixels on a display scaled to more than 100% (no blurry, oversized window)
DpiAware=1
; when the profile's video mode is not available (another monitor, another refresh rate) use the same size at any
; refresh rate, else the desktop's size, else 800x600, instead of stopping with "Invalid videomode specified"
ModeFallback=1
; with Borderless: the menus (which the game always runs at 800x600) at the monitor's resolution, sharp and at
; their own shape, instead of a blurry 800x600 picture stretched to the monitor. The game is also told it runs full
; screen, so it uses the resolution of the video options (game.setGameDisplayMode) instead of 800x600
NativeMenus=1

[FrameRate]
; no 60 fps cap (100 with vsync off): the game runs at up to MaxFps. game.lockFps <fps> in the console still
; works, and game.lockFps 0 means no limit. A capped game sleeps while it waits instead of keeping a core busy
Unlock=1
; frames per second at most with Unlock (30-1000); 0 = no limit (VSync=1 above limits it to the monitor's refresh
; rate). The game's Options - Video page gets a MAX FPS row for it (0-300), saved to Settings.ini
MaxFps=0
; 0 = no MAX FPS row on the Video page (the limit is then only MaxFps above)
MaxFpsOption=1
; the HUD and menu timers and fades in real time: the weapon bar, kill and chat messages stay up as long as they
; do at 60 fps at any frame rate, instead of vanishing early above 60 fps
FixHud=1

[Restart]
; the game starts a new copy of itself for every map, for hosting, joining and going back to the menu. With this
; the screen keeps showing the loading picture from the old copy to the new one (no desktop, no black flicker, no
; display mode changes, no BlackScreen.exe) and the new copy gets the keyboard and mouse straight away
Seamless=1

[Widescreen]
; the 3-D view at the screen's own shape: the vertical view stays as at 4:3 and wide screens see more at the sides
; (Hor+). Also fixes the culling that cut off terrain patches at the edges of wide screens. Drop old
; "renderer.fieldOfView 1.33" lines from Video.con: they were a work-around for the stretched picture
HorPlus=1
; the HUD and the menus at their own shape instead of stretched to the screen (menus and the loading screen stay
; centred, with black bars beside them)
FixHud=1
; while playing, every HUD element sits at the screen edge it belongs to (minimap and kill messages right, chat
; left, ...) instead of crowding the middle 4:3 part of a wide screen
AnchorHud=1
; HUD size in percent (50-200). The game's Options - General page gets a HUD SCALE slider for it, saved with the
; profile; this is the value for profiles that have none. Also bf1942patch.hudScale <percent> in the console
HudScale=100
; 0 = no slider and no console command (the HUD scale is then only HudScale above)
HudScaleOption=1

[Detail]
; how far out things inside the view keep their full detail, in percent of what the game and the map set
; (100-1000; 100 = as the original). The view distance, the fog and the distance at which objects disappear are
; never changed: they stay as the map / the server set them, so nobody sees farther than with the original game
; meshes (buildings, vehicles, soldiers, props) switch to their coarser versions this much farther away
MeshLod=300
; trees turn into flat billboards this much farther away (50 m in the original objects)
TreeLod=300
; the terrain drops to its coarser levels this much farther away (GeometryTemplate.lodDistance of the map)
TerrainLod=300
; the terrain's triangle budget (GeometryTemplate.targetTriCount of the map, 4000-5000 in the original maps; at
; most 200000 triangles): finer hills and slopes
TerrainDetail=400

[Gamepad]
; modern gamepads (Xbox, PlayStation, Switch Pro, ...) through SDL 2, offered to the game as its first joysticks:
; IDAxis_0/1 left stick, IDAxis_2/3 right stick, IDAxis_4/5 LT/RT; buttons 0 A, 1 B, 2 X, 3 Y, 4 LB, 5 RB,
; 6 Back, 7 Start, 8/9 stick clicks, 10/11 LT/RT, 12-15 D-pad up/down/left/right
UseSDL=1
; stick dead zone, percent (the game has none of its own)
Deadzone=15
; stick response: 100 = linear, 50 = squared (finer aim near the centre), 0 = cubed
Sensitivity=100
; run Settings\Gamepad.con (in the save folder; written with defaults the first time) after the profile's controls:
; move / look / fire / jump ... for infantry, land and sea vehicles, aircraft and the menu, next to the keyboard
; and mouse bindings. The Controls menu would drop these when it saves, so they live in their own file
Bindings=1
; hide a gamepad's own DirectInput entry, so it is not listed twice
HideDuplicates=1
; keyboard keys (DirectInput key codes) Start / Back also press, e.g. 1 = Escape, 15 = Tab; 0 = none
StartKey=0
BackKey=0

[Debug]
; log crashes with registers and a call chain to bf1942patch.log
CrashLog=0
; log every HUD box and the screen edge it is anchored to (troubleshooting [Widescreen] AnchorHud)
LogHud=0
; log the frame rate every 5 seconds (troubleshooting [FrameRate])
LogFps=0
